<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="40" y1="0" x2="40" y2="630" />
    <line x1="80" y1="0" x2="80" y2="630" /><line x1="120" y1="0" x2="120" y2="630" />
    <line x1="160" y1="0" x2="160" y2="630" /><line x1="200" y1="0" x2="200" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="280" y1="0" x2="280" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" /><line x1="360" y1="0" x2="360" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" /><line x1="440" y1="0" x2="440" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" /><line x1="520" y1="0" x2="520" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" /><line x1="600" y1="0" x2="600" y2="630" />
    <line x1="640" y1="0" x2="640" y2="630" /><line x1="680" y1="0" x2="680" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" /><line x1="760" y1="0" x2="760" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" /><line x1="840" y1="0" x2="840" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" /><line x1="920" y1="0" x2="920" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" /><line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" /><line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" /><line x1="1160" y1="0" x2="1160" y2="630" />
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" /><line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" /><line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" /><line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" /><line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="400" x2="1200" y2="400" /><line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="480" x2="1200" y2="480" /><line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="560" x2="1200" y2="560" /><line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Title -->
  <text x="600" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Building Effective Agents</text>

  <!-- Horizontal flow arrow (background) -->
  <line x1="140" y1="330" x2="1060" y2="330" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- STAGE 1: Single LLM -->
  <g transform="translate(200, 260)">
    <!-- Box -->
    <rect x="-70" y="-50" width="140" height="100" rx="12" fill="none" stroke="url(#accent1)" stroke-width="2" filter="url(#glow)"/>
    <rect x="-70" y="-50" width="140" height="100" rx="12" fill="#3b82f6" opacity="0.08"/>
    <!-- Icon: brain/model -->
    <circle cx="0" cy="-8" r="18" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="-7" cy="-13" r="2.5" fill="#3b82f6" opacity="0.6"/>
    <circle cx="7" cy="-13" r="2.5" fill="#3b82f6" opacity="0.6"/>
    <path d="M-6,-2 Q0,5 6,-2" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd" font-weight="600">Single LLM</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(320, 330)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
    <polygon points="60,-5 70,0 60,5" fill="#6366f1" opacity="0.5"/>
  </g>

  <!-- STAGE 2: Augmented LLM -->
  <g transform="translate(450, 260)">
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="none" stroke="url(#accent2)" stroke-width="2" filter="url(#glow)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="#6366f1" opacity="0.08"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Satellite nodes: retrieval, tools, memory -->
    <circle cx="-40" cy="-35" r="10" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.7"/>
    <text x="-40" y="-31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#818cf8">R</text>
    <line x1="-12" y1="-10" x2="-32" y2="-28" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

    <circle cx="40" cy="-35" r="10" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.7"/>
    <text x="40" y="-31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#818cf8">T</text>
    <line x1="12" y1="-10" x2="32" y2="-28" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

    <circle cx="0" cy="-50" r="10" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.7"/>
    <text x="0" y="-46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#818cf8">M</text>
    <line x1="0" y1="-16" x2="0" y2="-40" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

    <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a5b4fc" font-weight="600">Augmented LLM</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(570, 330)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
    <polygon points="60,-5 70,0 60,5" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- STAGE 3: Workflows -->
  <g transform="translate(700, 260)">
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="none" stroke="url(#accent3)" stroke-width="2" filter="url(#glow)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="#a855f7" opacity="0.08"/>
    <!-- Chain pattern -->
    <rect x="-45" y="-40" width="28" height="20" rx="4" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
    <rect x="-10" y="-40" width="28" height="20" rx="4" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
    <rect x="25" y="-40" width="28" height="20" rx="4" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
    <line x1="-17" y1="-30" x2="-10" y2="-30" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
    <line x1="18" y1="-30" x2="25" y2="-30" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
    <!-- Parallel pattern -->
    <rect x="-30" y="-5" width="22" height="16" rx="3" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <rect x="-3" y="-5" width="22" height="16" rx="3" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <!-- Router -->
    <circle cx="0" cy="28" r="8" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <line x1="-20" y1="28" x2="-8" y2="28" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
    <line x1="8" y1="28" x2="20" y2="28" stroke="#c084fc" stroke-width="1" opacity="0.3"/>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#d8b4fe" font-weight="600">Workflows</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(820, 330)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
    <polygon points="60,-5 70,0 60,5" fill="#ec4899" opacity="0.5"/>
  </g>

  <!-- STAGE 4: Autonomous Agent -->
  <g transform="translate(950, 260)">
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="none" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="#ec4899" opacity="0.08"/>
    <!-- Agent loop -->
    <circle cx="0" cy="-10" r="30" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <!-- Central agent -->
    <circle cx="0" cy="-10" r="12" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <!-- Loop arrow -->
    <path d="M25,-25 A35,35 0 0,1 25,5" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
    <polygon points="27,5 22,12 20,3" fill="#f472b6" opacity="0.7"/>
    <!-- Tool connections -->
    <line x1="-12" y1="-10" x2="-28" y2="-10" stroke="#f472b6" stroke-width="1" opacity="0.3"/>
    <circle cx="-32" cy="-10" r="4" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="-22" x2="0" y2="-34" stroke="#f472b6" stroke-width="1" opacity="0.3"/>
    <rect x="-4" y="-42" width="8" height="8" rx="2" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.4"/>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f9a8d4" font-weight="600">Autonomous Agent</text>
  </g>

  <!-- Bottom label bar -->
  <rect x="0" y="470" width="1200" height="1" fill="#334155" opacity="0.5"/>

  <!-- Topic pills -->
  <g transform="translate(600, 510)">
    <g transform="translate(-440, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e3a5f" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7dd3fc">Context Eng.</text>
    </g>
    <g transform="translate(-290, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2d1b4e" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Tool Design</text>
    </g>
    <g transform="translate(-140, 0)">
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#1e3a5f" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7dd3fc">MCP</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#2d1b4e" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Security</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#1e3a5f" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7dd3fc">Evaluation</text>
    </g>
    <g transform="translate(290, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#2d1b4e" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c4b5fd">Case Studies</text>
    </g>
    <g transform="translate(440, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1e3a5f" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7dd3fc">Anti-Patterns</text>
    </g>
  </g>

  <!-- Bottom text -->
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">11 Chapters · Open Source · CC BY-SA 4.0</text>
  <text x="600" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">github.com/machinedge/building-effective-agents</text>
</svg>
